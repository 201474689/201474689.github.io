<!DOCTYPE html>
<html>
<head>
    <title>三体运动模型</title>
    <style>
        body { margin: 0; overflow: hidden; background: black; }
        canvas { display: block; }
        #controls {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0,0,0,0.5);
            padding: 10px;
            border-radius: 5px;
        }
        button {
            background: #444;
            color: white;
            border: none;
            padding: 5px 10px;
            margin: 2px;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div id="controls">
        <button id="reset">重置</button>
        <span>主星体: <span id="primaryCount">3</span></span>
        <span>次级星体: <span id="secondaryCount">12</span></span>
    </div>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const resetBtn = document.getElementById('reset');
        
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        
        const G = 6.67430e-11;
        const scale = 1e9;
        const timeStep = 86400;
        
        class Body {
            constructor(x, y, vx, vy, mass, radius, color, isPrimary) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.mass = mass;
                this.radius = radius;
                this.color = color;
                this.isPrimary = isPrimary;
                this.ax = 0;
                this.ay = 0;
            }

            updateForces(bodies) {
                this.ax = 0;
                this.ay = 0;
                
                for (const body of bodies) {
                    if (body === this) continue;
                    
                    const dx = body.x - this.x;
                    const dy = body.y - this.y;
                    const distSq = dx * dx + dy * dy;
                    const dist = Math.sqrt(distSq);
                    
                    if (dist < this.radius + body.radius) {
                        if (!this.isPrimary && body.isPrimary) return true;
                        continue;
                    }
                    
                    const force = G * body.mass / (distSq * scale);
                    this.ax += force * dx / dist;
                    this.ay += force * dy / dist;
                }
                return false;
            }

            updatePosition() {
                this.vx += this.ax * timeStep;
                this.vy += this.ay * timeStep;
                this.x += this.vx * timeStep;
                this.y += this.vy * timeStep;
                
                if (this.x < 0) this.x = canvas.width;
                if (this.x > canvas.width) this.x = 0;
                if (this.y < 0) this.y = canvas.height;
                if (this.y > canvas.height) this.y = 0;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                
                if (this.isPrimary) {
                    const gradient = ctx.createRadialGradient(
                        this.x, this.y, this.radius,
                        this.x, this.y, this.radius * 2
                    );
                    gradient.addColorStop(0, this.color);
                    gradient.addColorStop(1, 'rgba(0,0,0,0)');
                    ctx.fillStyle = gradient;
                    ctx.arc(this.x, this.y, this.radius * 2, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }

        class Simulation {
            constructor() {
                this.bodies = [];
                this.primaryBodies = [];
                this.secondaryBodies = [];
                this.init();
            }

            init() {
                this.bodies = [];
                this.primaryBodies = [];
                this.secondaryBodies = [];
                
                const colors = ['#ff5555', '#55ff55', '#5555ff'];
                for (let i = 0; i < 3; i++) {
                    const angle = (i / 3) * Math.PI * 2;
                    const dist = canvas.width / 4;
                    const x = canvas.width / 2 + Math.cos(angle) * dist;
                    const y = canvas.height / 2 + Math.sin(angle) * dist;
                    const speed = 2e3;
                    const vx = -Math.sin(angle) * speed;
                    const vy = Math.cos(angle) * speed;
                    
                    const body = new Body(x, y, vx, vy, 1e28, 15, colors[i], true);
                    this.bodies.push(body);
                    this.primaryBodies.push(body);
                }
                
                for (let i = 0; i < 12; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const dist = canvas.width / 3 * (0.2 + Math.random() * 0.6);
                    const x = canvas.width / 2 + Math.cos(angle) * dist;
                    const y = canvas.height / 2 + Math.sin(angle) * dist;
                    const speed = 1e3 * (0.5 + Math.random());
                    const vx = -Math.sin(angle) * speed * (Math.random() > 0.5 ? 1 : -1);
                    const vy = Math.cos(angle) * speed * (Math.random() > 0.5 ? 1 : -1);
                    
                    const body = new Body(
                        x, y, vx, vy, 1e22, 3, 
                        `hsl(${Math.random() * 360}, 80%, 60%)`, 
                        false
                    );
                    this.bodies.push(body);
                    this.secondaryBodies.push(body);
                }
                
                this.updateCounters();
            }

            updateCounters() {
                document.getElementById('primaryCount').textContent = this.primaryBodies.length;
                document.getElementById('secondaryCount').textContent = this.secondaryBodies.length;
            }

            update() {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                const toRemove = [];
                for (const body of this.bodies) {
                    if (body.updateForces(this.bodies)) {
                        toRemove.push(body);
                    }
                }
                
                for (const body of toRemove) {
                    const index = this.bodies.indexOf(body);
                    if (index !== -1) this.bodies.splice(index, 1);
                    const secIndex = this.secondaryBodies.indexOf(body);
                    if (secIndex !== -1) this.secondaryBodies.splice(secIndex, 1);
                }
                
                for (const body of this.bodies) {
                    body.updatePosition();
                    body.draw();
                }
                
                this.updateCounters();
                requestAnimationFrame(() => this.update());
            }
        }

        const sim = new Simulation();
        resetBtn.addEventListener('click', () => sim.init());
        sim.update();
    </script>
</body>
</html>
